# ─────────────────────────────────────────────────────────────────────────────
# Location taxonomy — global coverage
# Each key is the canonical display name used in the UI dropdown.
# `variants` are the spelling forms that appear on LinkedIn profiles.
# ─────────────────────────────────────────────────────────────────────────────

locations:

  # ── India ──────────────────────────────────────────────────────────────────

  Bengaluru:
    region: India
    variants:
      - Bengaluru
      - Bangalore
      - Bengaluru, Karnataka, India
      - Bangalore, Karnataka, India
      - Greater Bengaluru Area
      - Bengaluru/Karnataka/India
      - Bangalore/Karnataka/India

  Mumbai:
    region: India
    variants:
      - Mumbai
      - Mumbai, Maharashtra, India
      - Greater Mumbai Area
      - Mumbai/Maharashtra/India

  Delhi NCR:
