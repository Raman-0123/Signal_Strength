[build-system]
requires = ["setuptools>=78", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "speedy-scraper"
version = "3.0.0"
description = "Simple multi-source public-search lead scraper"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "alembic>=1.16,<2",
  "beautifulsoup4>=4.12,<5",
  "cryptography>=45,<47",
  "ddgs>=9,<10",
  "fastapi>=0.116,<1",
  "google-api-python-client>=2.170,<3",
  "google-auth-oauthlib>=1.2,<2",
  "jinja2>=3.1,<4",
  "openpyxl>=3.1,<4",
  "pandas>=2,<3",
  "phonenumbers>=9,<10",
  "playwright>=1.45,<2",
  "psycopg[binary]>=3.2,<4",
  "PyYAML>=6.0.3,<7",
  "rapidfuzz>=3.14,<4",
  "sqlalchemy>=2.0,<3",
  "streamlit>=1.37,<2",
  "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
  "types-PyYAML>=6.0.12",
]

[project.scripts]
speedy-scraper = "speedy_scraper.cli:main"

[tool.setuptools]
packages = ["speedy_scraper"]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [".venv", ".venv-*", "archive", "exports", "__pycache__"]

[tool.ruff.lint]
select = ["E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
follow_imports = "skip"
